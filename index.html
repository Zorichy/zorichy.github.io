<style>

<script>
// ═══════════════════════════════════════════════════════════════════
// LAYOUT
// ═══════════════════════════════════════════════════════════════════
const MW=1240,MH=840,SEC_H=26,CT=SEC_H+14,CB_Y=MH-12,CH=CB_Y-CT;
const POT_DIV=Math.round(MW*.24),LEG_DIV=Math.round(MW*.77);
const SW_LEFT=POT_DIV+28,SW_RIGHT=LEG_DIV-28,SW_W=46,SW_H=98;
const sw_hg=Math.round((SW_RIGHT-SW_LEFT-3*SW_W)/4);
const sw_vg=Math.round((CH-3*SW_H)/4);
const sw_xs=[0,1,2].map(c=>SW_LEFT+sw_hg+c*(SW_W+sw_hg));
const sw_ys=[0,1,2].map(r=>CT+sw_vg+r*(SW_H+sw_vg));
const R=70,row_cy=sw_ys.map(y=>y+SW_H/2);
const p1_cy=Math.round((row_cy[0]+row_cy[1])/2),p2_cy=Math.round((row_cy[1]+row_cy[2])/2);
const POT_CX=Math.round(POT_DIV/2)+8,PIN_DYS=[-32,0,32];
const LEG_DOT_X=LEG_DIV+24,N_LEG=16,leg_sp=Math.round(CH/(N_LEG+1));

// ═══════════════════════════════════════════════════════════════════
// ROUTING
// ═══════════════════════════════════════════════════════════════════
const VSLOTS=6;
function buildVChans(){
  const gaps=[[SW_LEFT+2,sw_xs[0]-2],[sw_xs[0]+SW_W+2,sw_xs[1]-2],[sw_xs[1]+SW_W+2,sw_xs[2]-2],[sw_xs[2]+SW_W+2,SW_RIGHT-2]];
  const ch=[];
  gaps.forEach(([x1,x2])=>{for(let s=0;s<VSLOTS;s++)ch.push(Math.round(x1+(x2-x1)*(s+0.5)/VSLOTS));});
  return ch;
}
const VCHANS=buildVChans();

// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
// COLOR SYSTEM
// Large palette of perceptually spaced colors.
// pickBestColor() always returns the color most visually distinct
// from all currently used net colors, so duplicates never happen.
// ═══════════════════════════════════════════════════════════════════
const FULL_PAL = [
  '#e74c3c','#27ae60','#2980b9','#f39c12','#8e44ad','#16a085',
  '#e67e22','#2471a3','#1abc9c','#e91e63','#d35400','#6c5ce7',
  '#c0392b','#00b894','#0984e3','#a29bfe','#f1c40f','#00cec9',
  '#fd79a8','#55efc4','#fdcb6e','#74b9ff','#fab1a0','#81ecec',
  '#ff7675','#6ab04c','#22a6b3','#e55039','#badc58','#7ed6df',
  '#eb4d4b','#686de0','#30336b','#f9ca24','#6ab04c','#c7ecee',
  '#be2edd','#4834d4','#130f40','#30336b','#f0932b','#6ab04c',
];

// Convert hex to [r, g, b] 0-255
function hexToRgb(hex){
  return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}
// Perceptual distance between two hex colors (weighted euclidean in RGB)
function colorDist(a,b){
  const [r1,g1,b1]=hexToRgb(a),[r2,g2,b2]=hexToRgb(b);
  return Math.sqrt(2*(r1-r2)**2+4*(g1-g2)**2+3*(b1-b2)**2);
}
// Return the color from FULL_PAL that is most distinct from all currently used colors
function pickBestColor(){
  const used=Object.values(S.nets).map(n=>n.color);
  if(!used.length) return FULL_PAL[0];
  let bestColor=FULL_PAL[0], bestDist=-1;
  for(const c of FULL_PAL){
    // Skip colors already used
    if(used.includes(c)) continue;
    const minDist=Math.min(...used.map(u=>colorDist(c,u)));
    if(minDist>bestDist){bestDist=minDist;bestColor=c;}
  }
  return bestColor;
}
// Stable color for a PCB index — assigned once, then stored in the net.
// We don't use a fixed mapping anymore; instead we pick the best available
// color at the moment the PCB net is first created.
function pcbColor(pcbIdx){
  // If a net for this pcbIdx already exists, return its color
  const existing=Object.values(S.nets).find(n=>n.pcbIdx===pcbIdx);
  if(existing) return existing.color;
  return pickBestColor();
}

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
let S=freshState();
function freshState(){return{conns:[],nets:{},nc:0,notes:{},pcbLabels:Array(N_LEG).fill(''),potValues:{P1:'',P2:''}};}
function cloneState(s){
  return{conns:s.conns.map(c=>({...c})),
    nets:Object.fromEntries(Object.entries(s.nets).map(([k,v])=>[k,{color:v.color,dots:new Set(v.dots),pcbIdx:v.pcbIdx}])),
    nc:s.nc,notes:{...s.notes},
    pcbLabels:[...s.pcbLabels],
    potValues:{...(s.potValues||{})}};
}
// Sync label inputs → state (call before any pushUndo that might affect labels)
function syncLabelsToState(){
  S.pcbLabels=pcbInputs.map(inp=>inp.textContent?.trim()||'');
  S.potValues=S.potValues||{};
  Object.entries(pvInputs).forEach(([lbl,el])=>{S.potValues[lbl]=el.textContent?.trim()||'';});
}
// Sync state → label inputs (call after undo/redo)
function syncLabelsFromState(){
  S.pcbLabels.forEach((v,i)=>{if(pcbInputs[i])pcbInputs[i].textContent=v;});
}
// Sync pot values from state → divs (after undo/redo/load)
function syncDisplayDivs(){
  Object.entries(pvInputs).forEach(([lbl,el])=>{
    el.textContent=S.potValues?.[lbl]||'';
  });
}

let undoStack=[],redoStack=[];

      document.removeEventListener('mouseup',onUp);
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
});

function startDrag(idx,e){
  pcbDragIdx=idx;
  pcbInputs[idx].classList.add('pcb-dragging');
  dropZone.style.display='block';
  document.addEventListener('mousemove',onPcbDragMove);

function onPcbDragMove(e){
  if(pcbDragIdx===null) return;
  const matR=mat.getBoundingClientRect();
  const my=e.clientY-matR.top;
  // Find insertion slot
  let best=0, bestDist=Infinity;
  for(let i=0;i<=N_LEG;i++){
    const insertY=CT+leg_sp*i;
    const d=Math.abs(my-insertY);
    if(d<bestDist){bestDist=d;best=i;}
  }
  pcbDropIdx=best;

  // Position the glowing line at the insertion point
  const lineY=CT+leg_sp*pcbDropIdx;
  const zoneLeft=LEG_DOT_X-22;
  const zoneW=170;
  dropZoneLine.style.cssText='left:'+zoneLeft+'px;top:'+(lineY-1)+'px;width:'+zoneW+'px;';

  // Label: show what's being moved and where it lands
  const dragLabel=pcbInputs[pcbDragIdx].textContent||'(unlabeled)';
  dropZoneLbl.textContent='↕ '+dragLabel;
  // Position label to the right of the line, vertically centred on it
  dropZoneLbl.style.cssText='left:'+(zoneLeft+zoneW+6)+'px;top:'+(lineY-9)+'px;';
}

function onPcbDragUp(e){
  document.removeEventListener('mousemove',onPcbDragMove);
  document.removeEventListener('mouseup',onPcbDragUp);
  dropZone.style.display='none';
  const from=pcbDragIdx, to=pcbDropIdx;
  if(pcbDragIdx!==null) pcbInputs[pcbDragIdx].classList.remove('pcb-dragging');
  pcbDragIdx=null; pcbDropIdx=null;
  if(from===null||to===null) return;
  // 'to' is the insertion slot (0=before first, N_LEG=after last).
  // Convert to a destination index in the array.
  // Inserting at slot 'to' means the item ends up at index:
  //   - if moving down (to > from+1): dest = to-1
  //   - if moving up   (to <= from):  dest = to
  // When to === from or to === from+1 the item doesn't move — EXCEPT
  // when to === from exactly, which means &quot;insert just above myself&quot;,
  // i.e. swap with the row above.
  let dest;
  if(to===from){
    // Drop on own slot — swap with row above if possible
    if(from===0) return;
    dest=from-1;
  } else if(to===from+1){
    // Drop on slot just below own position — no movement
    return;
  } else if(to>from){
    dest=to-1;
  } else {
    dest=to;
  }
  if(dest===from) return;
  pushUndo();
  reorderPcbRows(from,dest);
}

function reorderPcbRows(from,to){
  // We swap CONTENT (labels + nets) between slots, keeping DOM fixed.
  // Build current logical order as array of slot indices [0..N_LEG-1]
  const order=Array.from({length:N_LEG},(_,i)=>i);
  // Move item at 'from' to 'to'
  const [moved]=order.splice(from,1);
  order.splice(to,0,moved);

  // Collect current state per slot
  const labels=pcbInputs.map(inp=>inp.textContent?.trim()||'');
  const netsBySlot=pcbInputs.map((_,i)=>{
    // Find all nets whose pcbIdx===i
    return Object.entries(S.nets)
      .filter(([,v])=>v.pcbIdx===i)
      .map(([k])=>k);
  });

  // Apply new order: slot i gets content from order[i]
  order.forEach((srcSlot,destSlot)=>{
    pcbInputs[destSlot].textContent=labels[srcSlot];
    // Update net pcbIdx: nets that were at srcSlot move to destSlot
    netsBySlot[srcSlot].forEach(nid=>{
      if(S.nets[nid]) S.nets[nid].pcbIdx=destSlot;
    });
    // Also update the dot connections: the dot 'pcb-destSlot' now represents
    // what was previously srcSlot's content. Connections are tied to dotIds,
    // so we need to swap which dotId the nets reference.
  });

  // Actually for connections: conns reference dotIds ('pcb-0' etc) which are
  // physically fixed. So we need to swap the dotId memberships in nets too.
  // Cleaner approach: swap everything by rebuilding net.dots for pcb slots.
  // Collect dotId sets per slot before remapping
  const dotSetsBySlot=Array.from({length:N_LEG},(_,i)=>{
    const dotId='pcb-'+i;
    // nets touching this dotId
    return Object.entries(S.nets)
      .filter(([,v])=>v.dots.has(dotId))
      .map(([k])=>k);
  });

  // Now for each destSlot, the content came from srcSlot=order[destSlot]
  // We need to move the dotId from srcSlot to destSlot in those nets.
  // Build a remapping: oldDotId -> newDotId
  // destSlot i gets content from order[i], so the dotId 'pcb-order[i]' should become 'pcb-i'
  // But dotIds are fixed in DOM. So instead we swap pcbIdx and dots membership.
  // Simplest: build new dots sets per net by applying the permutation.

  // For each net with pcbIdx, find which dest slot it belongs to (already set above),
  // and update its dots set: replace old pcb-X with pcb-(new slot).
  const permutation={};  // srcSlot -> destSlot
  order.forEach((src,dest)=>{permutation[src]=dest;});

  Object.values(S.nets).forEach(net=>{
    const newDots=new Set();
    net.dots.forEach(dotId=>{
      if(dotId.startsWith('pcb-')){
        const oldSlot=parseInt(dotId.slice(4));
        const newSlot=permutation[oldSlot];
        newDots.add('pcb-'+newSlot);
      } else {
        newDots.add(dotId);
      }
    });
    net.dots=newDots;
  });

  // Also remap conn from/to references for pcb dots
  S.conns.forEach(c=>{
    if(c.from.startsWith('pcb-')){
      const old=parseInt(c.from.slice(4));
      c.from='pcb-'+permutation[old];
    }
    if(c.to.startsWith('pcb-')){
      const old=parseInt(c.to.slice(4));
      c.to='pcb-'+permutation[old];
    }
  });

  render();
  st('PCB row moved.');
}

// DOT CLICK
// ═══════════════════════════════════════════════════════════════════
function onDot(id,ev){
  closePicker();
  const px=ev.clientX,py=ev.clientY;

  if(mode==='highlight'){
    const nets=getNetsOf(id);
    if(!nets.length){st('No connections here.');return;}
    if(nets.length===1){
      if(hlNets.has(nets[0]))hlNets.delete(nets[0]);else hlNets.add(nets[0]);
      render();st('Highlighted.');return;
    }
    const items=[{label:'All nets on this pin',color:'#00ffc8',value:'__all__'},...netItems(id,nets)];
    showPicker('Highlight net',items,px,py,val=>{
      if(val==='__all__'){const allHL=nets.every(n=>hlNets.has(n));nets.forEach(n=>allHL?hlNets.delete(n):hlNets.add(n));}
      else{if(hlNets.has(val))hlNets.delete(val);else hlNets.add(val);}
      render();
    });return;
  }

  if(mode==='delete'){
    const cidxs=getConnIdxsOf(id);
    if(!cidxs.length){st('No connections here.');return;}
    if(cidxs.length===1){doDelete(cidxs[0].i);return;}
    const items=cidxs.map(({c,i})=>{
      const other=c.from===id?c.to:c.from;const net=S.nets[c.net];
      return{label:other,color:net?net.color:'#888',value:i};
    });
    showPicker('Delete which?',items,px,py,val=>doDelete(val));return;
  }

  if(mode==='note'){
    const cidxs=getConnIdxsOf(id);
    if(!cidxs.length){st('No connections here.');return;}
    if(cidxs.length===1){openNote(cidxs[0].i,px,py);return;}
    const items=cidxs.map(({c,i})=>{
      const other=c.from===id?c.to:c.from;const net=S.nets[c.net];
      return{label:other,color:net?net.color:'#888',value:i};
    });
    showPicker('Note which connection?',items,px,py,val=>openNote(val,px,py));return;
  }

  if(mode==='recolor'){
    const nets=getNetsOf(id);
    if(!nets.length){st('No connections here.');return;}
    if(nets.length===1){doRecolor(nets[0],px,py);return;}
    const items=netItems(id,nets);
    showPicker('Recolor which net?',items,px,py,val=>doRecolor(val,px,py));return;
  }

  // Connect mode
  if(!sel){
    sel=id; selNet=null;
    const existingNets=getNetsOf(id);
    if(existingNets.length>1){
      // Multiple nets already on this pin — ask which to continue
      const items=[
        {label:'New separate net (new color)',color:'#00ffc8',value:'__new__'},
        ...netItems(id,existingNets)
      ];
      showPicker('Continue which net?',items,px,py,val=>{
        selNet=(val==='__new__')?'__new__':val;
        nodes[id].el.classList.add('sel');
        render(); st('Selected '+id+' — click target dot');
      });
      // Don't add 'sel' class yet — wait for picker choice
      return;
    }
    // 0 or 1 net — select immediately, no picker needed
    nodes[id].el.classList.add('sel');
    render(); st('Selected '+id+' — click target dot');
  } else if(sel===id){
    nodes[id].el.classList.remove('sel'); sel=null; selNet=null;
    render(); st('Deselected.');
  } else {
    const fid=sel, tid=id, sn=selNet;
    nodes[fid].el.classList.remove('sel'); sel=null; selNet=null;
    // Duplicate check
    if(S.conns.some(c=>((c.from===fid&amp;&amp;c.to===tid)||(c.from===tid&amp;&amp;c.to===fid))&amp;&amp;(sn&amp;&amp;sn!=='__new__'?c.net===sn:true))){
      render(); st('Already connected.'); return;
    }
    pushUndo();
    const forceNew = (sn==='__new__');

    let nid;
    if(sn &amp;&amp; sn!=='__new__' &amp;&amp; S.nets[sn]){
      // User explicitly chose to continue an existing net from a multi-net pin
      nid=sn;
      S.nets[nid].dots.add(fid); S.nets[nid].dots.add(tid);
    } else if(forceNew){
      // User explicitly wants a brand new separate net
      const pcbA=pcbIdxOf(fid), pcbB=pcbIdxOf(tid), tpi=pcbA>=0?pcbA:pcbB>=0?pcbB:-1;
      const color=tpi>=0?pcbColor(tpi):pickBestColor();
      nid='n'+(++S.nc);
      S.nets[nid]={color,dots:new Set([fid,tid]),pcbIdx:tpi};
    } else {
      // Determine net purely from the START point (fid), never from the endpoint.
      // This means arriving at a busy pin does NOT absorb or merge nets.

      const pcbFrom = pcbIdxOf(fid);
      const netsOnFrom = getNetsOf(fid);

      if(pcbFrom >= 0){
        // Starting from a PCB point — find or create the net for this PCB index
        const existing = Object.entries(S.nets).find(([,v])=>v.pcbIdx===pcbFrom)?.[0] || null;
        if(existing){
          nid=existing;
          S.nets[nid].dots.add(fid); S.nets[nid].dots.add(tid);
        } else {
          nid='n'+(++S.nc);
          S.nets[nid]={color:pcbColor(pcbFrom), dots:new Set([fid,tid]), pcbIdx:pcbFrom};
        }
      } else if(netsOnFrom.length===1){
        // Starting from a pin with exactly one net — extend that net
        nid=netsOnFrom[0];
        S.nets[nid].dots.add(fid); S.nets[nid].dots.add(tid);
      } else if(netsOnFrom.length===0){
        // Starting from an unconnected pin — check if landing on a PCB point
        const pcbTo = pcbIdxOf(tid);
        if(pcbTo>=0){
          const existing = Object.entries(S.nets).find(([,v])=>v.pcbIdx===pcbTo)?.[0] || null;
          if(existing){
            nid=existing;
            S.nets[nid].dots.add(fid); S.nets[nid].dots.add(tid);
          } else {
            nid='n'+(++S.nc);
            S.nets[nid]={color:pcbColor(pcbTo), dots:new Set([fid,tid]), pcbIdx:pcbTo};
          }
        } else {
          // Neither end has any net — fresh net with palette color
          nid='n'+(++S.nc);
          S.nets[nid]={color:pickBestColor(), dots:new Set([fid,tid]), pcbIdx:-1};
        }
      }
      // netsOnFrom.length > 1 is handled above by the picker (selNet would be set)
    }
    S.conns.push({from:fid, to:tid, net:nid});
    render(); st('Connected! ('+S.conns.length+')');
  }
}

function doDelete(idx){
  pushUndo();
  const net=S.conns[idx].net;
  S.conns.splice(idx,1);
  const nn={};Object.entries(S.notes).forEach(([k,v])=>{const ki=parseInt(k);if(ki<idx)nn[k]=v;else if(ki>idx)nn[''+(ki-1)]=v;});
  S.notes=nn;rebuildNet(net);hlNets.delete(net);render();st('Deleted.');
}

// CANVAS CLICK — line-mode clicks (highlight line / note / delete / recolor on line)
// ═══════════════════════════════════════════════════════════════════
function entryPt(id){if(potEx[id])return{x:potEx[id].x,y:potEx[id].y};return{x:nodes[id].x,y:nodes[id].y};}

function computeRoutes(){
  const vOcc=VCHANS.map(()=>[]),routes=[];
  S.conns.forEach((conn,ci)=>{
    const n1=nodes[conn.from],n2=nodes[conn.to];if(!n1||!n2)return;
    const color=S.nets[conn.net]?S.nets[conn.net].color:'#aaa';
    const A=entryPt(conn.from),B=entryPt(conn.to);
    if(Math.abs(A.y-B.y)<2){routes.push({segs:[[A.x,A.y,B.x,B.y]],color,net:conn.net,idx:ci});return;}
    const yMin=Math.min(A.y,B.y),yMax=Math.max(A.y,B.y),idealX=(A.x+B.x)/2;
    let bestV=-1,bestScore=Infinity;
    VCHANS.forEach((vx,vi)=>{
      if(vOcc[vi].some(s=>s.y1<yMax+3&amp;&amp;s.y2>yMin-3))return;
      const inRange=vx>=Math.min(A.x,B.x)-10&amp;&amp;vx<=Math.max(A.x,B.x)+10;
      const score=Math.abs(vx-idealX)+(inRange?0:200);
      if(score<bestScore){bestScore=score;bestV=vi;}
    });
    if(bestV===-1){const mx=(A.x+B.x)/2;routes.push({segs:[[A.x,A.y,mx,A.y],[mx,A.y,mx,B.y],[mx,B.y,B.x,B.y]],color,net:conn.net,idx:ci});return;}
    const vx=VCHANS[bestV];vOcc[bestV].push({y1:yMin,y2:yMax});
    routes.push({segs:[[A.x,A.y,vx,A.y],[vx,A.y,vx,B.y],[vx,B.y,B.x,B.y]],color,net:conn.net,idx:ci});
  });
  return routes;
}

function ptSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1;if(!dx&amp;&amp;!dy)return Math.hypot(px-x1,py-y1);
  const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function findRoute(mx,my){
  const routes=computeRoutes();let best=-1,bestD=14,bestNet=null;
  routes.forEach(({segs,net},idx)=>{
    segs.forEach(([x1,y1,x2,y2])=>{const d=ptSeg(mx,my,x1,y1,x2,y2);if(d<bestD){bestD=d;best=idx;bestNet=net;}});
  });return{idx:best,net:bestNet};
}

cI.addEventListener('click',e=>{
  const r=cI.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const{idx,net}=findRoute(mx,my);
  if(mode==='highlight'){
    if(idx<0){hlNets.clear();render();return;}
    if(hlNets.has(net))hlNets.delete(net);else hlNets.add(net);
    render();
  } else if(mode==='note'){
    if(idx>=0)openNote(idx,e.clientX,e.clientY);
  } else if(mode==='delete'){
    if(idx>=0)doDelete(idx);
  } else if(mode==='recolor'){
    if(idx>=0&amp;&amp;net&amp;&amp;S.nets[net])doRecolor(net,e.clientX+8,e.clientY+8);
  }
});

cI.addEventListener('mousemove',e=>{

  hideTooltip();

});

const MODE_COLS={connect:'#00ffc8',highlight:'#f9ca24',note:'#a29bfe',delete:'#ff4444',recolor:'#f39c12'};

// ═══════════════════════════════════════════════════════════════════
// DRAW DOT — pie slices for multi-net pins
// ═══════════════════════════════════════════════════════════════════
function drawDot(ctx,x,y,r,netColors,isSelected,isDimmed){
  // netColors: array of color strings (one per net on this pin)
  const alpha=isDimmed?0.25:1;
  ctx.save();ctx.globalAlpha=alpha;
  if(netColors.length===0){
    // Unconnected — white fill, dark border
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle='white';ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();
  } else if(netColors.length===1){
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=h2r(netColors[0],0.3);ctx.fill();
    ctx.strokeStyle=netColors[0];ctx.lineWidth=2.5;ctx.stroke();
  } else {
    // Pie slices
    const step=(Math.PI*2)/netColors.length;
    netColors.forEach((col,i)=>{
      ctx.beginPath();ctx.moveTo(x,y);
      ctx.arc(x,y,r,i*step-Math.PI/2,(i+1)*step-Math.PI/2);
      ctx.closePath();ctx.fillStyle=col;ctx.fill();
    });
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1;ctx.stroke();
    // Thin dividers
    netColors.forEach((_,i)=>{
      const ang=i*(Math.PI*2/netColors.length)-Math.PI/2;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+r*Math.cos(ang),y+r*Math.sin(ang));
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.stroke();
    });
  }
  if(isSelected){
    ctx.beginPath();ctx.arc(x,y,r+3,0,Math.PI*2);
    ctx.strokeStyle='#00ffc8';ctx.lineWidth=2.5;ctx.stroke();
  }
  ctx.restore();
}

// LINE STYLE

function getLS(){
  switch(document.getElementById('ls').value){
    case 'dashed':return{d:[10,6],w:2.5};case 'dotted':return{d:[2,5],w:2.5};
    case 'thick':return{d:[],w:4.5};case 'thin':return{d:[],w:1.5};default:return{d:[],w:2.5};
  }
}
function drawSegs(ctx,segs,color,lw,dash,alpha){
  ctx.save();ctx.globalAlpha=alpha||1;ctx.strokeStyle=color;ctx.lineWidth=lw;
  ctx.setLineDash(dash||[]);ctx.lineJoin='round';ctx.lineCap='round';
  segs.forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
  ctx.setLineDash([]);ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════
function render(){
  xB.clearRect(0,0,MW,MH);xF.clearRect(0,0,MW,MH);
  const hasHL=hlNets.size>0;

  // Dividers
  xB.setLineDash([8,5]);xB.strokeStyle='#bbb';xB.lineWidth=1.5;
  [POT_DIV,LEG_DIV].forEach(x=>{xB.beginPath();xB.moveTo(x,0);xB.lineTo(x,MH);xB.stroke();});
  xB.setLineDash([]);

  // Pot stubs
  [{cy:p1_cy,lbl:'p1'},{cy:p2_cy,lbl:'p2'}].forEach(({cy,lbl})=>{
    PIN_DYS.forEach((dy,i)=>{
      const ang=Math.atan2(dy,R),ex=Math.round(POT_CX+R*Math.cos(ang)),ey=cy+dy;
      const nets=getNetsOf(lbl+'-'+(i+1));
      const col=nets.length&amp;&amp;S.nets[nets[0]]?S.nets[nets[0]].color:'#555';
      const dim=hasHL&amp;&amp;!nets.some(n=>hlNets.has(n));
      xB.globalAlpha=dim?0.2:1;
      xB.setLineDash([5,4]);xB.strokeStyle=col;xB.lineWidth=nets.length?2:1.5;
      xB.beginPath();xB.moveTo(ex,ey);xB.lineTo(ex+32,ey);xB.stroke();
      xB.setLineDash([]);xB.beginPath();xB.moveTo(ex+32,ey);xB.lineTo(ex+54,ey);xB.stroke();
      xB.globalAlpha=1;
    });
  });

  // Connections
  const ls=getLS(),routes=computeRoutes();
  routes.forEach(({segs,color,net})=>{
    const isHL=hlNets.has(net),dim=hasHL&amp;&amp;!isHL;
    drawSegs(dim?xB:xF,segs,color,isHL?ls.w+1.5:ls.w,ls.d,dim?0.15:1);
    if(isHL)drawSegs(xF,segs,color,ls.w+5,ls.d,0.14);
  });

  // Note diamonds
  dpos=[];
  routes.forEach(({segs,color,net},idx)=>{
    const note=S.notes[''+idx];if(!note)return;
    const ms=segs[Math.floor(segs.length/2)],mx=(ms[0]+ms[2])/2,my=(ms[1]+ms[3])/2;
    dpos.push({x:mx,y:my,idx,note});
    const dim=hasHL&amp;&amp;!hlNets.has(net),ctx=dim?xB:xF,ds=7;
    ctx.save();ctx.globalAlpha=dim?0.25:1;
    ctx.fillStyle=color;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(mx,my-ds);ctx.lineTo(mx+ds,my);ctx.lineTo(mx,my+ds);ctx.lineTo(mx-ds,my);ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('!',mx,my);ctx.restore();
  });

  // Draw all dots on front canvas
  Object.entries(nodes).forEach(([id,node])=>{
    const nets=getNetsOf(id);
    const colors=nets.map(n=>S.nets[n]?.color).filter(Boolean);
    const dim=hasHL&amp;&amp;!nets.some(n=>hlNets.has(n))&amp;&amp;nets.length>0;
    drawDot(xF,node.x,node.y,node.r,colors,id===sel,dim);
  });

  // ── Notes table in the bottom gap — anchored to bottom, grows upward ──
  const noteAreaTop=sw_ys[2]+SW_H+4;
  const noteAreaBot=CB_Y-4;
  const noteAreaLeft=POT_DIV+6;
  const noteAreaRight=LEG_DIV-6;
  const noteEntries=Object.entries(S.notes).filter(([idx])=>S.conns[parseInt(idx)]);
  if(noteEntries.length>0 &amp;&amp; noteAreaBot-noteAreaTop>14){
    const LABEL_H=11, ROW_H=13;
    const totalH=LABEL_H+noteEntries.length*ROW_H;
    // Start from bottom, grow up
    let y=noteAreaBot-totalH;
    if(y<noteAreaTop) y=noteAreaTop;
    // Header
    xB.save();
    xB.font='bold 8px &quot;Orbitron&quot;,monospace';
    xB.fillStyle='#888';xB.textBaseline='top';xB.textAlign='left';
    xB.fillText('NOTES',noteAreaLeft+4,y);
    y+=LABEL_H;
    // Rows
    xB.font='9px &quot;Share Tech Mono&quot;,monospace';
    noteEntries.forEach(([idx,note])=>{
      const conn=S.conns[parseInt(idx)];if(!conn)return;
      const net=S.nets[conn.net];const color=net?.color||'#888';
      const from=conn.from.startsWith('pcb-')?(S.pcbLabels[parseInt(conn.from.slice(4))]||conn.from):conn.from;
      const to=conn.to.startsWith('pcb-')?(S.pcbLabels[parseInt(conn.to.slice(4))]||conn.to):conn.to;
      if(y+ROW_H>noteAreaBot) return;
      xB.fillStyle=color;
      xB.beginPath();xB.arc(noteAreaLeft+7,y+ROW_H/2,3.5,0,Math.PI*2);xB.fill();
      xB.fillStyle='#222';
      xB.fillText(from+' \u2192 '+to+': '+note.replace(/\n/g,' \xb7 '),noteAreaLeft+16,y+ROW_H/2-4);
      y+=ROW_H;
    });
    xB.restore();
  }
}

// Parse version string like &quot;v1&quot;, &quot;v3&quot;, &quot;2&quot;, &quot;rev4&quot; → number
function parseRev(s){const m=(s||'').match(/(\d+)\s*$/);return m?parseInt(m[1]):0;}
function bumpRev(s){
  const n=parseRev(s);
  // Keep prefix before the number, increment the number
  const m=(s||'').match(/^(.*?)(\d+)\s*$/);
  if(m) return m[1]+(n+1);
  return 'v'+(n+1);
}

  syncLabelsToState();

  const revEl=document.getElementById('fr');

  revEl.value=newRev;
  const d={meta:{project:document.getElementById('fp').value,date:document.getElementById('fd').value,rev:newRev},

    nets:Object.fromEntries(Object.entries(S.nets).map(([k,v])=>[k,{color:v.color,dots:[...v.dots],pcbIdx:v.pcbIdx}])),nc:S.nc};

// EXPORT — single crisp A4 canvas (all formats identical)

// ═══════════════════════════════════════════════════════════════════
const A4W=2338, A4H=1653;

  if(proj||rev){
    t+=' \u2014 ';
    if(proj) t+=proj;

    if(rev) t+=rev;
  }
  return t;
}

function buildExportCanvas(cb){
  const mat=document.getElementById('matrix');
  const matW=mat.offsetWidth, matH=mat.offsetHeight;
  const noteEntries=Object.entries(S.notes).filter(([idx])=>S.conns[parseInt(idx)]);
  const hasNotes=noteEntries.length>0;
  const TITLE_H=56, ROW_H=28, NOTES_HEAD_H=52;
  const notesAreaH=0; // notes are now drawn inside the matrix canvas
  const availH=A4H - TITLE_H - notesAreaH - 32;
  const scale=Math.min((A4W-32)/matW, availH/matH);
  const mW=Math.round(matW*scale), mH=Math.round(matH*scale);
  const out=document.createElement('canvas');
  out.width=A4W; out.height=A4H;
  const ctx=out.getContext('2d');
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,A4W,A4H);

  // Title — full format matching on-screen title bar
  const TX=24, TY=16;
  ctx.font='bold 24px Orbitron,monospace';
  ctx.fillStyle='#111'; ctx.textBaseline='top'; ctx.textAlign='left';
  ctx.fillText(getFullTitle(), TX, TY);
  // Date on the right if available
  const date=document.getElementById('fd').value.trim();
  if(date){
    ctx.font='15px Share Tech Mono,monospace';
    ctx.fillStyle='#888'; ctx.textAlign='right';
    ctx.fillText(date, A4W-TX, TY+6);
    ctx.textAlign='left';
  }
  ctx.strokeStyle='#222'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(TX,TY+TITLE_H-8); ctx.lineTo(A4W-TX,TY+TITLE_H-8); ctx.stroke();

  // Capture DOM matrix with html2canvas
  const matTop=TY+TITLE_H;
  const matLeft=Math.round((A4W-mW)/2);

  function doCapture(){
    const ci=document.getElementById('ci'); ci.style.display='none';
    html2canvas(mat,{
      scale:Math.max(3, scale*3),
      useCORS:true, backgroundColor:'#ffffff', logging:false
    }).then(domCanvas=>{
      ci.style.display='';
      ctx.drawImage(domCanvas, matLeft, matTop, mW, mH);
      // Notes are rendered inside the matrix canvas by render() itself
      cb(out);
    }).catch(err=>{
      ci.style.display='';
      st('Export error: '+err.message);
    });
  }

  if(window.html2canvas){ doCapture(); }
  else {
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=doCapture;
    s.onerror=()=>st('Could not load export library — check internet connection.');
    document.head.appendChild(s);
  }
}

<script>
// ═══════════════════ PALETTE ════════════════════════════════════════
const FULL_PAL=['#e74c3c','#27ae60','#2980b9','#f39c12','#8e44ad','#16a085',
  '#e67e22','#2471a3','#1abc9c','#e91e63','#d35400','#6c5ce7',
  '#c0392b','#00b894','#0984e3','#a29bfe','#f1c40f','#00cec9','#fd79a8','#55efc4'];
function hRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function cDist(a,b){const[r1,g1,b1]=hRgb(a),[r2,g2,b2]=hRgb(b);return Math.sqrt(2*(r1-r2)**2+4*(g1-g2)**2+3*(b1-b2)**2);}
function pickColor(){
  const used=Object.values(S.nets).map(n=>n.color);
  if(!used.length)return FULL_PAL[0];
  let best=FULL_PAL[0],bd=-1;
  for(const c of FULL_PAL){
    if(used.includes(c))continue;
    const d=Math.min(...used.map(u=>cDist(c,u)));
    if(d>bd){bd=d;best=c;}
  }
  return best;
}
function pcbColor(i){const e=Object.values(S.nets).find(n=>n.pcbIdx===i);return e?e.color:pickColor();}
function h2r(hex,a){const[r,g,b]=hRgb(hex);return`rgba(${r},${g},${b},${a})`;}

// ═══════════════════ CONSTANTS ═══════════════════════════════════════
const N_PCB=16;
function pcbIdx(id){return id.startsWith('pcb-')?parseInt(id.slice(4)):-1;}

// ═══════════════════ UNSAVED + AUTO-VERSION ══════════════════════════
let isDirty=false;
function markDirty(){if(!isDirty){isDirty=true;document.title='* CB Matrix';const si=document.getElementById('save-ind');if(si)si.style.display='flex';}}
function markClean(){isDirty=false;document.title='CB Matrix';const si=document.getElementById('save-ind');if(si)si.style.display='none';}
window.addEventListener('beforeunload',e=>{if(isDirty){e.preventDefault();e.returnValue='';}});
function parseRev(s){const m=(s||'').match(/(\d+)\s*$/);return m?parseInt(m[1]):0;}
function bumpRev(s){const n=parseRev(s);const m=(s||'').match(/^(.*?)(\d+)\s*$/);return m?m[1]+(n+1):'v'+(n+1);}

// ═══════════════════ STATE ══════════════════════════════════════════
function fresh(){return{conns:[],nets:{},nc:0,notes:{},pcbLabels:Array(N_PCB).fill(''),potValues:{P1:'',P2:''}};}
function clone(s){return{
  conns:s.conns.map(c=>({...c})),
  nets:Object.fromEntries(Object.entries(s.nets).map(([k,v])=>[k,{color:v.color,dots:new Set(v.dots),pcbIdx:v.pcbIdx}])),
  nc:s.nc,notes:{...s.notes},pcbLabels:[...s.pcbLabels],potValues:{...s.potValues}
};}
let S=fresh(),undos=[],redos=[];
function pu(){undos.push(clone(S));redos=[];if(undos.length>30)undos.shift();markDirty();}
function undoLast(){if(!undos.length){st('Nothing to undo.');return;}redos.push(clone(S));S=undos.pop();rebuildUI();drawLines();st('Undo!');}
function redoLast(){if(!redos.length){st('Nothing to redo.');return;}undos.push(clone(S));S=redos.pop();rebuildUI();drawLines();st('Redo!');}
function clearAll(){pu();S=fresh();closeSheet('meta-ov');rebuildUI();drawLines();st('Cleared.');}

// ═══════════════════ NET HELPERS ════════════════════════════════════
function netsOf(id){return Object.keys(S.nets).filter(k=>S.nets[k].dots.has(id));}
function connsOf(id){return S.conns.map((c,i)=>({c,i})).filter(({c})=>c.from===id||c.to===id);}
function rebuildNet(nid){
  if(!S.nets[nid])return;
  const s=new Set();S.conns.forEach(c=>{if(c.net===nid){s.add(c.from);s.add(c.to);}});
  S.nets[nid].dots=s;if(!s.size)delete S.nets[nid];
}

// ═══════════════════ MODE ════════════════════════════════════════════
let mode='connect',sel=null,selNet=null,hlNets=new Set(),aNoteIdx=null,aColorNet=null;
function setMode(m){
  if(mode==='highlight'&amp;&amp;m!=='highlight')hlNets.clear();
  mode=m;sel=null;selNet=null;
  document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
  const tb=document.getElementById('tab-'+m);if(tb)tb.classList.add('active');
  rebuildUI();drawLines();
  const msgs={connect:'Tap a dot to start',highlight:'Tap dot to trace nets',note:'Tap dot to annotate',delete:'Tap dot to delete',recolor:'Tap dot to recolor'};
  st(msgs[m]||'');
}
let stT;
function st(msg){const e=document.getElementById('st');e.textContent=msg;e.classList.add('show');clearTimeout(stT);stT=setTimeout(()=>e.classList.remove('show'),2500);}

// ═══════════════════ DOT TAP ════════════════════════════════════════
function onTap(id){
  if(mode==='highlight'){
    const ns=netsOf(id);if(!ns.length){st('No connections.');return;}
    if(ns.length===1){hlNets.has(ns[0])?hlNets.delete(ns[0]):hlNets.add(ns[0]);rebuildUI();drawLines();return;}
    pickNet('Highlight net',[{label:'All on this pin',color:'#00ffc8',value:'__all__',sub:''},...npi(id,ns)],val=>{
      if(val==='__all__'){const all=ns.every(n=>hlNets.has(n));ns.forEach(n=>all?hlNets.delete(n):hlNets.add(n));}
      else{hlNets.has(val)?hlNets.delete(val):hlNets.add(val);}rebuildUI();drawLines();});return;
  }
  if(mode==='delete'){
    const ci=connsOf(id);if(!ci.length){st('No connections.');return;}
    if(ci.length===1){doDel(ci[0].i);return;}
    pickNet('Delete which?',ci.map(({c,i})=>({label:c.from===id?c.to:c.from,color:S.nets[c.net]?.color||'#888',value:i,sub:''})),doDel);return;
  }
  if(mode==='note'){
    const ci=connsOf(id);if(!ci.length){st('No connections.');return;}
    if(ci.length===1){openNote(ci[0].i);return;}
    pickNet('Note which?',ci.map(({c,i})=>({label:c.from===id?c.to:c.from,color:S.nets[c.net]?.color||'#888',value:i,sub:''})),openNote);return;
  }
  if(mode==='recolor'){
    const ns=netsOf(id);if(!ns.length){st('No connections.');return;}
    if(ns.length===1){openColor(ns[0]);return;}
    pickNet('Recolor which?',npi(id,ns),openColor);return;
  }
  // connect
  if(!sel){
    const en=netsOf(id);
    if(en.length>1){
      pickNet('Continue which net?',[{label:'New separate net',color:'#00ffc8',value:'__new__',sub:'new color'},...npi(id,en)],val=>{
        sel=id;selNet=val==='__new__'?'__new__':val;pulseDot(id);rebuildUI();st('Selected — tap target');});return;
    }
    sel=id;selNet=null;pulseDot(id);rebuildUI();st('Tap target dot');
  } else if(sel===id){
    sel=null;selNet=null;rebuildUI();st('Deselected.');
  } else {
    const fid=sel,tid=id,sn=selNet;sel=null;selNet=null;
    if(S.conns.some(c=>(c.from===fid&amp;&amp;c.to===tid)||(c.from===tid&amp;&amp;c.to===fid))){rebuildUI();st('Already connected.');return;}
    pu();
    let nid;
    if(sn&amp;&amp;sn!=='__new__'&amp;&amp;S.nets[sn]){nid=sn;S.nets[nid].dots.add(fid);S.nets[nid].dots.add(tid);}
    else if(sn==='__new__'){
      const pi=pcbIdx(fid)>=0?pcbIdx(fid):pcbIdx(tid)>=0?pcbIdx(tid):-1;
      nid='n'+(++S.nc);S.nets[nid]={color:pi>=0?pcbColor(pi):pickColor(),dots:new Set([fid,tid]),pcbIdx:pi};
    } else {
      const pf=pcbIdx(fid),pt=pcbIdx(tid),nf=netsOf(fid);
      if(pf>=0){const ex=Object.entries(S.nets).find(([,v])=>v.pcbIdx===pf)?.[0];if(ex){nid=ex;S.nets[nid].dots.add(fid);S.nets[nid].dots.add(tid);}else{nid='n'+(++S.nc);S.nets[nid]={color:pcbColor(pf),dots:new Set([fid,tid]),pcbIdx:pf};}}
      else if(nf.length===1){nid=nf[0];S.nets[nid].dots.add(tid);}
      else if(!nf.length){if(pt>=0){const ex=Object.entries(S.nets).find(([,v])=>v.pcbIdx===pt)?.[0];if(ex){nid=ex;S.nets[nid].dots.add(fid);S.nets[nid].dots.add(tid);}else{nid='n'+(++S.nc);S.nets[nid]={color:pcbColor(pt),dots:new Set([fid,tid]),pcbIdx:pt};}}else{nid='n'+(++S.nc);S.nets[nid]={color:pickColor(),dots:new Set([fid,tid]),pcbIdx:-1};}}
    }
    if(nid){S.nets[nid].dots.add(fid);S.nets[nid].dots.add(tid);S.conns.push({from:fid,to:tid,net:nid});}
    rebuildUI();drawLines();st('Connected! ('+S.conns.length+')');
  }
}

function doDel(idx){
  pu();const net=S.conns[idx].net;S.conns.splice(idx,1);
  const nn={};Object.entries(S.notes).forEach(([k,v])=>{const ki=parseInt(k);if(ki<idx)nn[k]=v;else if(ki>idx)nn[''+(ki-1)]=v;});
  S.notes=nn;rebuildNet(net);hlNets.delete(net);rebuildUI();drawLines();st('Deleted.');
}

// ═══════════════════ NET PICKER ══════════════════════════════════════
function npi(dotId,netIds){
  return netIds.map(nid=>{
    const net=S.nets[nid];
    const lbl=net?.pcbIdx>=0?(S.pcbLabels[net.pcbIdx]?.trim()||''):'';
    return{label:lbl,color:net?.color||'#888',value:nid,sub:net?.pcbIdx<0?'no PCB':''};
  });
}
function pickNet(title,items,cb){
  document.getElementById('np-title').textContent=title;
  const cont=document.getElementById('np-items');cont.innerHTML='';
  items.forEach(it=>{
    const row=document.createElement('div');row.className='s-item';
    const sw=document.createElement('div');sw.className='s-swatch';sw.style.background=it.color;
    const lbl=document.createElement('div');lbl.style.flex='1';lbl.textContent=it.label||'';
    if(it.sub){const s=document.createElement('div');s.className='s-sub';s.textContent=it.sub;lbl.appendChild(s);}
    row.appendChild(sw);row.appendChild(lbl);
    row.addEventListener('click',()=>{closeSheet('netpick-ov');cb(it.value);});
    cont.appendChild(row);
  });
  openSheet('netpick-ov');
}

// ═══════════════════ NOTE ════════════════════════════════════════════
function openNote(idx){
  aNoteIdx=idx;const c=S.conns[idx];
  document.getElementById('nfrom').textContent=c?c.from+' → '+c.to:'';
  document.getElementById('ntxt').value=S.notes[''+idx]||'';
  openSheet('note-ov');setTimeout(()=>document.getElementById('ntxt').focus(),300);
}
function saveNote(){
  const txt=document.getElementById('ntxt').value.trim();
  if(aNoteIdx!==null){pu();if(txt)S.notes[''+aNoteIdx]=txt;else delete S.notes[''+aNoteIdx];}
  closeSheet('note-ov');rebuildUI();drawLines();aNoteIdx=null;
}
document.getElementById('ntxt').addEventListener('keydown',e=>{if(e.key==='Enter'&amp;&amp;!e.shiftKey){e.preventDefault();saveNote();}});

// ═══════════════════ COLOR ════════════════════════════════════════════
function openColor(nid){
  aColorNet=nid;const col=S.nets[nid]?.color||'#888';
  document.getElementById('cprev').style.background=col;document.getElementById('cpick').value=col;openSheet('color-ov');
}
function onColorInput(v){if(!aColorNet)return;pu();S.nets[aColorNet].color=v;document.getElementById('cprev').style.background=v;rebuildUI();drawLines();}

// ═══════════════════ SHEETS ══════════════════════════════════════════
function openSheet(id){document.getElementById(id).classList.add('open');}
function closeSheet(id){document.getElementById(id).classList.remove('open');}

// ═══════════════════ PCB EDIT ════════════════════════════════════════
function openPcbEdit(){
  // Populate pot value fields
  document.getElementById('pv1').value=S.potValues.P1||'';
  document.getElementById('pv2').value=S.potValues.P2||'';
  const cont=document.getElementById('pcb-edit-rows');cont.innerHTML='';
  for(let i=0;i<N_PCB;i++){
    const ns=netsOf('pcb-'+i);const col=ns.length&amp;&amp;S.nets[ns[0]]?S.nets[ns[0]].color:'#333';
    const row=document.createElement('div');row.className='pcb-edit-row';
    const num=document.createElement('div');num.className='pcb-edit-num';num.textContent=i+1;
    const dot=document.createElement('div');dot.className='pcb-edit-dot';dot.style.background=col;
    const inp=document.createElement('input');inp.className='pcb-edit-inp';inp.placeholder='label…';
    inp.value=S.pcbLabels[i]||'';inp.dataset.idx=i;
    row.appendChild(num);row.appendChild(dot);row.appendChild(inp);cont.appendChild(row);
  }
  openSheet('pcb-ov');
}
function savePcbLabels(){
  S.potValues.P1=document.getElementById('pv1').value;
  S.potValues.P2=document.getElementById('pv2').value;
  document.querySelectorAll('.pcb-edit-inp[data-idx]').forEach(inp=>{S.pcbLabels[parseInt(inp.dataset.idx)]=inp.value;});
  closeSheet('pcb-ov');rebuildUI();drawLines();
}

// ═══════════════════ DOT SVG ═════════════════════════════════════════
const DOT_R=11;
const svgMap={};
function makeDotSvg(id){
  const sz=DOT_R*2+6,NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width',sz);svg.setAttribute('height',sz);svg.setAttribute('viewBox',`0 0 ${sz} ${sz}`);
  svg.style.cssText='display:block;cursor:pointer;touch-action:manipulation;overflow:visible;';
  svg.addEventListener('click',e=>{e.stopPropagation();onTap(id);});
  return svg;
}
function updDot(svg,id){
  const sz=DOT_R*2+6,cx=sz/2,cy=sz/2,r=DOT_R,NS='http://www.w3.org/2000/svg';
  svg.innerHTML='';
  const nets=netsOf(id),isSel=id===sel,hasHL=hlNets.size>0,isHL=nets.some(n=>hlNets.has(n)),dim=hasHL&amp;&amp;!isHL&amp;&amp;nets.length>0;
  if(!nets.length){
    const c=document.createElementNS(NS,'circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',r);
    c.setAttribute('fill','white');c.setAttribute('stroke','#333');c.setAttribute('stroke-width','1.6');svg.appendChild(c);
  } else if(nets.length===1){
    const col=S.nets[nets[0]]?.color||'#888';
    const c=document.createElementNS(NS,'circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',r);
    c.setAttribute('fill',h2r(col,dim?.06:.3));c.setAttribute('stroke',dim?'#444':col);c.setAttribute('stroke-width','2');svg.appendChild(c);
  } else {
    const step=Math.PI*2/nets.length;
    nets.forEach((nid,i)=>{
      const col=S.nets[nid]?.color||'#888';
      const a1=i*step-Math.PI/2,a2=(i+1)*step-Math.PI/2;
      const p=document.createElementNS(NS,'path');
      p.setAttribute('d',`M${cx},${cy} L${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)} A${r},${r} 0 0,1 ${cx+r*Math.cos(a2)},${cy+r*Math.sin(a2)} Z`);
      p.setAttribute('fill',dim?h2r(col,.06):col);svg.appendChild(p);
    });
    const c=document.createElementNS(NS,'circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',r);
    c.setAttribute('fill','none');c.setAttribute('stroke','rgba(0,0,0,.2)');c.setAttribute('stroke-width','1');svg.appendChild(c);
  }
  if(isSel){
    const ring=document.createElementNS(NS,'circle');ring.setAttribute('cx',cx);ring.setAttribute('cy',cy);ring.setAttribute('r',r+3);
    ring.setAttribute('fill','none');ring.setAttribute('stroke','#00ffc8');ring.setAttribute('stroke-width','2');svg.appendChild(ring);
  }
}
function pulseDot(id){
  const wrap=document.querySelector(`.dot-wrap[data-id=&quot;${id}&quot;]`);if(!wrap)return;
  const p=document.createElement('div');p.className='sel-pulse';
  const sz=DOT_R*2+6;p.style.cssText=`width:${sz}px;height:${sz}px;`;wrap.appendChild(p);setTimeout(()=>p.remove(),600);
}

// ═══════════════════ GET DOT SCREEN POSITION ════════════════════════
function dotPos(id){
  // Find the SVG element directly for accurate center measurement
  const svg=document.querySelector(`.dot-wrap[data-id=&quot;${id}&quot;] svg`);
  if(!svg) return null;
  const svgR=svg.getBoundingClientRect();
  const matR=document.getElementById('matrix-wrap').getBoundingClientRect();
  const scrollTop=document.getElementById('main').scrollTop;
  return{
    x: svgR.left - matR.left + svgR.width/2,
    y: svgR.top  - matR.top  + svgR.height/2 + scrollTop
  };
}

// ═══════════════════ DRAW LINES ══════════════════════════════════════
function drawLines(){
  const wrap=document.getElementById('matrix-wrap');
  const dpr=window.devicePixelRatio||1;
  const W=wrap.offsetWidth, H=wrap.offsetHeight;

  // Size both canvases identically
  [document.getElementById('line-canvas'), document.getElementById('line-canvas-front')].forEach(c=>{
    c.width=W*dpr; c.height=H*dpr;
    c.style.width=W+'px'; c.style.height=H+'px';
  });

  // Draw all lines on the FRONT canvas (z-index 25, above dots and cells)
  const canvas=document.getElementById('line-canvas-front');
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const hasHL=hlNets.size>0;

  S.conns.forEach((conn,ci)=>{
    const p1=dotPos(conn.from), p2=dotPos(conn.to);
    if(!p1||!p2) return;
    const net=S.nets[conn.net];
    if(!net) return;
    const color=net.color;
    const isHL=hlNets.has(conn.net);
    const dim=hasHL&amp;&amp;!isHL;
    const alpha=dim?0.12:1;
    const lw=isHL?3:1.8;

    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.strokeStyle=color;
    ctx.lineWidth=lw;
    ctx.lineJoin='round';
    ctx.lineCap='round';

    // L-shaped route: horizontal then vertical then horizontal
    // Use midpoint x
    const midX=(p1.x+p2.x)/2;
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(midX,p1.y);
    ctx.lineTo(midX,p2.y);
    ctx.lineTo(p2.x,p2.y);
    ctx.stroke();

    // Glow for highlighted
    if(isHL){
      ctx.globalAlpha=0.15;ctx.lineWidth=lw+5;
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(midX,p1.y);ctx.lineTo(midX,p2.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    }

    // Note diamond
    if(S.notes[''+ci]){
      const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
      const ds=5;
      ctx.globalAlpha=dim?0.2:1;ctx.fillStyle=color;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(mx,my-ds);ctx.lineTo(mx+ds,my);ctx.lineTo(mx,my+ds);ctx.lineTo(mx-ds,my);ctx.closePath();
      ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',mx,my);
    }
    ctx.restore();
  });
}

// ═══════════════════ BUILD UI ════════════════════════════════════════
function buildSwitches(){
  for(let sw=0;sw<9;sw++){
    const col=sw%3,row=Math.floor(sw/3);
    const cell=document.getElementById(`sw-r${row}c${col}`);cell.innerHTML='';
    const lbl=document.createElement('div');lbl.className='sw-lbl';lbl.textContent='SW'+(sw+1);cell.appendChild(lbl);
    for(let p=1;p<=3;p++){
      const id=`sw${sw+1}-${p}`;
      const wrap=document.createElement('div');wrap.className='dot-wrap';wrap.dataset.id=id;wrap.style.cssText='align-items:center;';
      const svg=makeDotSvg(id);svgMap[id]=svg;updDot(svg,id);wrap.appendChild(svg);
      connsOf(id).forEach(({i})=>{if(S.notes[''+i]){const b=document.createElement('div');b.className='nbadge';wrap.appendChild(b);}});
      cell.appendChild(wrap);
    }
  }
}

function buildPots(){
  const col=document.getElementById('pot-col');col.innerHTML='';
  ['P1','P2'].forEach(pot=>{
    const grp=document.createElement('div');grp.className='pot-grp';
    const lbl=document.createElement('div');lbl.className='pot-lbl';lbl.textContent=pot;grp.appendChild(lbl);
    const pv=S.potValues[pot];
    if(pv){const v=document.createElement('div');v.className='pot-val-txt';v.title=pv;v.textContent=pv;grp.appendChild(v);}
    for(let p=1;p<=3;p++){
      const id=`${pot}-${p}`;
      const wrap=document.createElement('div');wrap.className='dot-wrap';wrap.dataset.id=id;
      const svg=makeDotSvg(id);svgMap[id]=svg;updDot(svg,id);wrap.appendChild(svg);
      const pn=document.createElement('div');pn.style.cssText='font-size:.36rem;color:var(--dim);text-align:center;line-height:1;';pn.textContent='.'+p;wrap.appendChild(pn);
      grp.appendChild(wrap);
    }
    col.appendChild(grp);
  });
}

function buildPcb(){
  const col=document.getElementById('pcb-col');col.innerHTML='';
  for(let i=0;i<N_PCB;i++){
    const id='pcb-'+i;
    const row=document.createElement('div');row.className='pcb-row-m';
    const num=document.createElement('div');num.className='pcb-num';num.textContent=i+1;
    const wrap=document.createElement('div');wrap.className='dot-wrap';wrap.dataset.id=id;
    const svg=makeDotSvg(id);svgMap[id]=svg;updDot(svg,id);wrap.appendChild(svg);
    connsOf(id).forEach(({i:ci})=>{if(S.notes[''+ci]){const b=document.createElement('div');b.className='nbadge';wrap.appendChild(b);}});
    const lbl=document.createElement('div');lbl.className='pcb-lbl';lbl.title=S.pcbLabels[i]||'';lbl.textContent=S.pcbLabels[i]||'';
    row.appendChild(num);row.appendChild(wrap);row.appendChild(lbl);col.appendChild(row);
  }
}

function rebuildUI(){
  buildSwitches();buildPots();buildPcb();
  Object.entries(svgMap).forEach(([id,svg])=>updDot(svg,id));
  // Redraw lines after layout settles
  requestAnimationFrame(()=>requestAnimationFrame(drawLines));
}

// ═══════════════════ SAVE / LOAD ═════════════════════════════════════
function saveProject(){
  // Sync pot values from edit sheet if open
  const pv1=document.getElementById('pv1');const pv2=document.getElementById('pv2');
  if(pv1)S.potValues.P1=pv1.value;if(pv2)S.potValues.P2=pv2.value;
  // Auto-bump revision
  const revEl=document.getElementById('mr');
  const newRev=bumpRev(revEl.value);
  revEl.value=newRev;
  const d={meta:{project:document.getElementById('mp').value,date:document.getElementById('md').value,rev:newRev},
    pcbLabels:S.pcbLabels,potValues:S.potValues,conns:S.conns.map(c=>({...c})),notes:S.notes,
    nets:Object.fromEntries(Object.entries(S.nets).map(([k,v])=>[k,{color:v.color,dots:[...v.dots],pcbIdx:v.pcbIdx}])),nc:S.nc};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));
  a.download=((d.meta.project||'matrix').replace(/\s+/g,'_').toLowerCase())+'_v'+parseRev(newRev)+'_cbmatrix.json';
  a.click();URL.revokeObjectURL(a.href);closeSheet('meta-ov');markClean();st('Saved! ('+newRev+')');
}
function onLoad(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      document.getElementById('mp').value=d.meta?.project||'';
      document.getElementById('md').value=d.meta?.date||'';
      document.getElementById('mr').value=d.meta?.rev||'';
      pu();
      S.pcbLabels=d.pcbLabels||Array(N_PCB).fill('');
      S.potValues=d.potValues||{P1:'',P2:''};
      S.conns=d.conns||[];S.notes=d.notes||{};
      S.nets=Object.fromEntries(Object.entries(d.nets||{}).map(([k,v])=>[k,{color:v.color,dots:new Set(v.dots),pcbIdx:v.pcbIdx}]));
      S.nc=d.nc||0;hlNets.clear();rebuildUI();closeSheet('meta-ov');markClean();st('Loaded! ('+d.meta?.rev+')');
    }catch(err){st('Error: '+err.message);}
  };
  rd.readAsText(f);e.target.value='';
}

// Redraw on resize
window.addEventListener('resize',()=>{rebuildUI();});

// ═══════════════════ INIT ════════════════════════════════════════════
rebuildUI();
setMode('connect');
</script>
